<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Лови!</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b0614; overflow: hidden; touch-action: none;
    user-select: none; -webkit-user-select: none; font-family: 'Press Start 2P', monospace; line-height: 1.5; }
  canvas { display: block; width: 100%; height: 100%; }

  .overlay { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; background: rgba(8, 4, 16, .88); color: #fff; text-align: center;
    padding: 18px 14px; box-sizing: border-box; font-size: 11px; }
  .overlay.show { display: flex; }
  .scroll { width: 100%; max-width: 440px; max-height: 66vh; overflow-y: auto; touch-action: pan-y;
    -webkit-overflow-scrolling: touch; box-sizing: border-box; }

  h1 { margin: 0; font-size: 40px; font-weight: 400; letter-spacing: 2px; color: #ffd23f;
    text-shadow: 4px 4px 0 #ff3d6e, 8px 8px 0 #36c8ff; animation: wob 2s steps(2) infinite; }
  @keyframes wob { 50% { transform: translateY(-3px); } }
  h2 { margin: 0; font-size: 18px; font-weight: 400; color: #ffd23f; text-shadow: 3px 3px 0 #ff3d6e; }

  button { font: inherit; font-size: 12px; color: #12061f; background: #ffd23f; border: 0; border-radius: 0;
    padding: 14px 20px; cursor: pointer; text-transform: uppercase;
    box-shadow: inset -4px -4px 0 rgba(0,0,0,.28), inset 4px 4px 0 rgba(255,255,255,.4), 0 4px 0 #8a6a00; }
  button:active { transform: translateY(3px); box-shadow: inset -4px -4px 0 rgba(0,0,0,.28), inset 4px 4px 0 rgba(255,255,255,.4); }
  button.alt { background: #36c8ff; box-shadow: inset -4px -4px 0 rgba(0,0,0,.28), inset 4px 4px 0 rgba(255,255,255,.4), 0 4px 0 #0b6a91; }
  button.ghost { background: #8a7fa3; box-shadow: inset -4px -4px 0 rgba(0,0,0,.28), inset 4px 4px 0 rgba(255,255,255,.3), 0 4px 0 #4a4160; }
  button.green { background: #7dff5c; box-shadow: inset -4px -4px 0 rgba(0,0,0,.28), inset 4px 4px 0 rgba(255,255,255,.4), 0 4px 0 #2d8a14; }
  button:disabled { opacity: .45; }
  .menu-btns { display: flex; flex-direction: column; gap: 14px; width: 250px; }
  .menu-btns button { font-size: 14px; }
  .row-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  .stats { display: flex; gap: 18px; font-size: 11px; color: #ffd23f; flex-wrap: wrap; justify-content: center; }
  .rules { display: grid; grid-template-columns: auto auto; gap: 6px 14px; font-size: 9px; text-align: left; }
  .rules span { display: flex; align-items: center; gap: 8px; }
  .rules img { height: 22px; width: 22px; object-fit: contain; }
  .rules b { color: #ffd23f; font-weight: 400; text-align: right; }
  .hint { font-size: 8px; line-height: 1.7; opacity: .7; max-width: 300px; }

  .card { border: 4px solid #fff; background: rgba(255,255,255,.07); padding: 10px; margin-bottom: 10px; text-align: left;
    display: flex; flex-direction: column; gap: 6px; }
  .card.done { border-color: #7dff5c; background: rgba(125,255,92,.12); }
  .card.locked { opacity: .65; }
  .card .t { font-size: 10px; color: #ffd23f; }
  .card .d { font-size: 8px; line-height: 1.7; opacity: .85; }
  .card .r { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 9px; }
  .card button { font-size: 9px; padding: 9px 12px; }
  .pips { letter-spacing: 3px; color: #7dff5c; font-size: 12px; }
  .sec { font-size: 9px; color: #36c8ff; text-align: left; margin: 4px 0 8px; }

  .stamps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; }
  .stamps div { background: rgba(255,255,255,.08); border: 3px solid #555; height: 52px; display: flex; align-items: center; justify-content: center; }
  .stamps div.got { border-color: #ffd23f; }
  .stamps img { max-width: 100%; max-height: 100%; }
  .stamps div:not(.got) img { filter: grayscale(1) brightness(.12); }

  .big { font-size: 34px; color: #ffd23f; text-shadow: 3px 3px 0 #ff3d6e; }
  .small { font-size: 10px; opacity: .85; }
  .newach { font-size: 9px; color: #7dff5c; line-height: 1.8; max-width: 320px; }

  #toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); background: #7dff5c; color: #12061f;
    padding: 10px 14px; font-size: 9px; border: 3px solid #12061f; display: none; z-index: 10; text-align: center; max-width: 90vw; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="toast"></div>

<!-- ГЛАВНОЕ МЕНЮ -->
<div class="overlay show" id="menu">
  <h1>ЛОВИ!</h1>
  <div class="stats"><span id="mCoins"></span><span id="mBest"></span></div>
  <div class="menu-btns">
    <button id="play" class="green">Играть</button>
    <button id="toShop" class="alt">Магазин</button>
    <button id="toAch">Достижения</button>
  </div>
  <div class="rules">
    <span><img src="img/dollar.png" alt="">Доллары</span><b>+10</b>
    <span><img src="img/redbull.png" alt="">Ред Булл</span><b>+25</b>
    <span><img src="img/syringe.png" alt="">Шмурдяк</span><b>+40</b>
    <span><img src="img/xanax.png" alt="">Ксан</span><b>+50</b>
    <span><img src="img/acid0.png" alt="">Марка</span><b>+200</b>
  </div>
  <div class="hint">Марка падает 1–3 раза за раунд и летит очень быстро. Поймал: радуга, предметов x3, очки x10. Двигай пальцем.</div>
</div>

<!-- МАГАЗИН -->
<div class="overlay" id="shop">
  <h2>МАГАЗИН</h2>
  <div class="stats"><span id="sCoins"></span></div>
  <div class="scroll" id="shopList"></div>
  <button id="shopBack" class="ghost">В меню</button>
</div>

<!-- ДОСТИЖЕНИЯ -->
<div class="overlay" id="ach">
  <h2>ДОСТИЖЕНИЯ</h2>
  <div class="stats"><span id="aCount"></span></div>
  <div class="scroll" id="achList"></div>
  <button id="achBack" class="ghost">В меню</button>
</div>

<!-- КОНЕЦ РАУНДА -->
<div class="overlay" id="end">
  <div class="small">Твой счёт</div>
  <div class="big" id="finalScore">0</div>
  <div class="small" id="bestLine"></div>
  <div class="small" id="earned"></div>
  <div class="newach" id="newAch"></div>
  <div class="row-btns">
    <button id="again" class="green">Ещё раз</button>
    <button id="toMenu" class="ghost">В меню</button>
  </div>
</div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { tg.disableVerticalSwipes(); } catch (e) {}
    try { tg.setHeaderColor('#0b0614'); tg.setBackgroundColor('#0b0614'); } catch (e) {}
  }
  const haptic = (kind) => {
    try {
      if (!tg || !tg.HapticFeedback) return;
      if (kind === 'big') tg.HapticFeedback.notificationOccurred('success');
      else tg.HapticFeedback.impactOccurred('light');
    } catch (e) {}
  };
  const FONT = '"Press Start 2P", monospace';
  const $ = (id) => document.getElementById(id);

  // ================= СОХРАНЕНИЕ =================
  const KEY = 'catch_save_v2';
  const defSave = () => ({
    best: 0, coins: 0, rounds: 0,
    totals: { dollar: 0, redbull: 0, syringe: 0, xanax: 0, acid: 0 },
    stamps: [], up: { wide: 0, time: 0, trip: 0 },
    theme: 'city', themes: ['city'], ach: {}, bought: false,
  });
  let save = defSave();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const o = JSON.parse(raw), d = defSave();
      save = Object.assign(d, o);
      save.totals = Object.assign(defSave().totals, o.totals || {});
      save.up = Object.assign(defSave().up, o.up || {});
    } else {
      save.best = parseInt(localStorage.getItem('catch_best') || '0', 10) || 0;
    }
  } catch (e) {}
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }

  // ================= МАГАЗИН / ДОСТИЖЕНИЯ: ДАННЫЕ =================
  const UPS = [
    { id: 'wide', name: 'Широкие руки', desc: 'Ловишь шире: +15% за уровень', costs: [100, 250, 500] },
    { id: 'time', name: 'Больше времени', desc: '+5 секунд к раунду за уровень', costs: [150, 300, 600] },
    { id: 'trip', name: 'Долгий приход', desc: 'Радуга дольше на 2 секунды за уровень', costs: [200, 400, 800] },
  ];
  const THEMES = {
    city:   { name: 'Ночной город', cost: 0,   top: '#0b0614', bot: '#2a0f45', lamp: '255,170,60' },
    sunset: { name: 'Закат',        cost: 300, top: '#240b36', bot: '#c31432', lamp: '255,120,200' },
    matrix: { name: 'Матрица',      cost: 300, top: '#000a03', bot: '#04451c', lamp: '60,255,120' },
  };
  const ACH = [
    { id: 'first',  name: 'Первый раунд',      desc: 'Сыграй один раунд',                    reward: 20,  ok: (s) => s.rounds >= 1 },
    { id: 'play10', name: 'Постоянный клиент', desc: 'Сыграй 10 раундов',                    reward: 100, ok: (s) => s.rounds >= 10 },
    { id: 's500',   name: 'Разогрелся',        desc: 'Набери 500 очков за раунд',            reward: 50,  ok: (s) => s.best >= 500 },
    { id: 's2000',  name: 'Две тысячи',        desc: 'Набери 2000 очков за раунд',           reward: 100, ok: (s) => s.best >= 2000 },
    { id: 's10000', name: 'Лютый рекорд',      desc: 'Набери 10000 очков за раунд',          reward: 300, ok: (s) => s.best >= 10000 },
    { id: 'acid1',  name: 'Приход',            desc: 'Поймай свою первую марку',             reward: 50,  ok: (s) => s.totals.acid >= 1 },
    { id: 'acid3',  name: 'Тройной приход',    desc: 'Поймай 3 марки за один раунд',         reward: 150, ok: (s, r) => r.acid >= 3 },
    { id: 'col5',   name: 'Полколлекции',      desc: 'Собери 5 разных марок',                reward: 100, ok: (s) => s.stamps.length >= 5 },
    { id: 'col10',  name: 'Коллекционер',      desc: 'Собери все 10 марок',                  reward: 300, ok: (s) => s.stamps.length >= 10 },
    { id: 'dollar', name: 'Денежный дождь',    desc: 'Поймай 100 долларов',                  reward: 60,  ok: (s) => s.totals.dollar >= 100 },
    { id: 'redbull',name: 'Крылья',            desc: 'Поймай 50 Ред Буллов',                 reward: 60,  ok: (s) => s.totals.redbull >= 50 },
    { id: 'xanax',  name: 'Полное спокойствие',desc: 'Поймай 50 ксанов',                     reward: 60,  ok: (s) => s.totals.xanax >= 50 },
    { id: 'syringe',name: 'Шмурдяк-маньяк',    desc: 'Поймай 50 шмурдяков',                  reward: 60,  ok: (s) => s.totals.syringe >= 50 },
    { id: 'shop',   name: 'Шопоголик',         desc: 'Купи что-нибудь в магазине',           reward: 40,  ok: (s) => s.bought },
    { id: 'rich',   name: 'Богач',             desc: 'Накопи 1000 монет',                    reward: 100, ok: (s) => s.coins >= 1000 },
  ];
  function checkAch(r) {
    const out = [];
    let again = true;
    while (again) {
      again = false;
      for (const a of ACH) {
        if (!save.ach[a.id] && a.ok(save, r)) {
          save.ach[a.id] = 1; save.coins += a.reward; out.push(a); again = true;
        }
      }
    }
    return out;
  }

  // ================= ЭКРАНЫ =================
  const screens = ['menu', 'shop', 'ach', 'end'];
  function show(name) {
    screens.forEach((n) => $(n).classList.toggle('show', n === name));
    if (name === 'menu') updateMenu();
    if (name === 'shop') renderShop();
    if (name === 'ach') renderAch();
  }
  function updateMenu() {
    $('mCoins').textContent = '🪙 ' + save.coins;
    $('mBest').textContent = 'РЕКОРД ' + save.best;
  }
  let toastTimer = null;
  function toast(text) {
    const t = $('toast'); t.textContent = text; t.style.display = 'block';
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2200);
  }

  function renderShop() {
    $('sCoins').textContent = '🪙 ' + save.coins;
    let h = '<div class="sec">УЛУЧШЕНИЯ</div>';
    for (const u of UPS) {
      const lvl = save.up[u.id], max = u.costs.length;
      const pips = '■'.repeat(lvl) + '□'.repeat(max - lvl);
      const btn = lvl >= max
        ? '<button disabled>Макс</button>'
        : `<button data-act="up" data-id="${u.id}" ${save.coins < u.costs[lvl] ? 'class="ghost"' : ''}>🪙 ${u.costs[lvl]}</button>`;
      h += `<div class="card"><div class="t">${u.name}</div><div class="d">${u.desc}</div>
            <div class="r"><span class="pips">${pips}</span>${btn}</div></div>`;
    }
    h += '<div class="sec">ФОНЫ</div>';
    for (const id of Object.keys(THEMES)) {
      const th = THEMES[id], owned = save.themes.includes(id);
      let btn;
      if (save.theme === id) btn = '<button disabled>Выбран</button>';
      else if (owned) btn = `<button class="alt" data-act="theme" data-id="${id}">Выбрать</button>`;
      else btn = `<button data-act="theme" data-id="${id}" ${save.coins < th.cost ? 'class="ghost"' : ''}>🪙 ${th.cost}</button>`;
      h += `<div class="card"><div class="t">${th.name}</div><div class="r"><span></span>${btn}</div></div>`;
    }
    $('shopList').innerHTML = h;
  }
  function afterBuy() {
    const got = checkAch({ acid: 0 });
    if (got.length) toast('Достижение: ' + got[0].name + ' +' + got[0].reward + ' 🪙');
    persist(); renderShop(); updateMenu();
  }
  $('shopList').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const id = b.dataset.id;
    if (b.dataset.act === 'up') {
      const u = UPS.find((q) => q.id === id), lvl = save.up[id];
      if (lvl >= u.costs.length) return;
      if (save.coins < u.costs[lvl]) { toast('Не хватает монет'); return; }
      save.coins -= u.costs[lvl]; save.up[id]++; save.bought = true; afterBuy();
    } else {
      const th = THEMES[id];
      if (save.themes.includes(id)) { save.theme = id; persist(); renderShop(); return; }
      if (save.coins < th.cost) { toast('Не хватает монет'); return; }
      save.coins -= th.cost; save.themes.push(id); save.theme = id; save.bought = true; afterBuy();
    }
  });

  function renderAch() {
    const done = ACH.filter((a) => save.ach[a.id]).length;
    $('aCount').textContent = done + ' / ' + ACH.length;
    let h = '<div class="sec">КОЛЛЕКЦИЯ МАРОК ' + save.stamps.length + ' / 10</div><div class="stamps">';
    for (let k = 0; k < 10; k++) h += `<div class="${save.stamps.includes(k) ? 'got' : ''}"><img src="img/acid${k}.png" alt=""></div>`;
    h += '</div><div class="sec">ДОСТИЖЕНИЯ</div>';
    for (const a of ACH) {
      const d = !!save.ach[a.id];
      h += `<div class="card ${d ? 'done' : 'locked'}"><div class="t">${d ? '🏆' : '🔒'} ${a.name}</div>
            <div class="d">${a.desc}</div><div class="r"><span>${d ? 'ПОЛУЧЕНО' : 'Награда'}</span><span>🪙 ${a.reward}</span></div></div>`;
    }
    $('achList').innerHTML = h;
  }

  // ================= ИГРА =================
  const cv = $('c');
  const ctx = cv.getContext('2d');
  let W, H, DPR, S;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = Math.min(W, H * 0.62) / 400;
  }
  window.addEventListener('resize', resize);
  resize();

  const img = new Image();
  img.src = 'player.png';
  const pics = {};
  ['dollar', 'redbull', 'syringe', 'xanax'].forEach((n) => { const i = new Image(); i.src = 'img/' + n + '.png'; pics[n] = i; });
  const acidImgs = [];
  for (let k = 0; k < 10; k++) { const i = new Image(); i.src = 'img/acid' + k + '.png'; acidImgs.push(i); }

  let ROUND = 60, RAIN = 8;
  const TYPES = [
    { id: 'dollar',  pts: 10,  w: 40, r: 22 },
    { id: 'redbull', pts: 25,  w: 22, r: 22 },
    { id: 'syringe', pts: 40,  w: 16, r: 22 },
    { id: 'xanax',   pts: 50,  w: 18, r: 22 },
    { id: 'acid',    pts: 200, w: 0,  r: 24 },
  ];
  const TOTAL_W = TYPES.reduce((a, t) => a + t.w, 0);

  let running = false;
  let acidPlan = [], acidPending = null;
  let score, timeLeft, rainbow, spawnT, items, floats, parts, player, targetX, rs, keys = {};

  // от 1 до 3 марок за раунд, не ближе 12 секунд друг к другу
  function planAcid() {
    const cnt = 1 + Math.floor(Math.random() * 3);
    for (let tries = 0; tries < 200; tries++) {
      const ts = [];
      for (let i = 0; i < cnt; i++) ts.push(5 + Math.random() * (ROUND - 10));
      ts.sort((a, b) => a - b);
      if (ts.every((v, i) => i === 0 || v - ts[i - 1] >= 12)) return ts;
    }
    return [ROUND / 2];
  }
  function spawnAcid(x) {
    const t = TYPES.find((q) => q.id === 'acid');
    const r = t.r * S;
    const idx = Math.floor(Math.random() * acidImgs.length);
    items.push({ t, r, x, y: -r, vy: (950 + Math.random() * 150) * (H / 700), rot: 0, vr: 0, idx, img: acidImgs[idx] });
  }

  function reset() {
    ROUND = 60 + 5 * save.up.time;
    RAIN = 8 + 2 * save.up.trip;
    score = 0; timeLeft = ROUND; rainbow = 0; spawnT = 0.3;
    items = []; floats = []; parts = [];
    rs = { counts: {}, acid: 0, stamps: [] };
    acidPending = null; acidPlan = planAcid();
    player = { x: W / 2 };
    targetX = W / 2;
  }
  reset();

  function pick() {
    let r = Math.random() * TOTAL_W;
    for (const t of TYPES) { if ((r -= t.w) < 0) return t; }
    return TYPES[0];
  }
  function spawn() {
    const t = pick();
    const r = t.r * S;
    items.push({
      t, r, x: r + Math.random() * (W - 2 * r), y: -r,
      vy: (170 + Math.random() * 130) * (H / 700) * (1 + (1 - timeLeft / ROUND) * 0.35),
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 3,
    });
  }

  function playerBox() {
    const ph = Math.min(H * 0.27, 300);
    const pw = img.width ? ph * img.width / img.height : ph * 0.83;
    return { ph, pw, top: H - ph - 4, left: player.x - pw / 2 };
  }

  function addFloat(x, y, text, color) { floats.push({ x, y, text, color, life: 0.9 }); }
  function burst(x, y, n, rainbowMode) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, v = 80 + Math.random() * 220;
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: 0.6,
        hue: rainbowMode ? Math.random() * 360 : 45 });
    }
  }

  function update(dt) {
    const speed = 900 * S;
    if (keys.ArrowLeft || keys.a) targetX -= speed * dt;
    if (keys.ArrowRight || keys.d) targetX += speed * dt;
    const b0 = playerBox();
    targetX = Math.max(b0.pw * 0.3, Math.min(W - b0.pw * 0.3, targetX));
    player.x += (targetX - player.x) * Math.min(1, dt * 18);

    if (running) {
      timeLeft -= dt;
      if (rainbow > 0) rainbow = Math.max(0, rainbow - dt);
      spawnT -= dt;
      const base = 0.72 - 0.28 * (1 - timeLeft / ROUND);
      const interval = base / (rainbow > 0 ? 3 : 1);
      while (spawnT <= 0) { spawn(); spawnT += interval; }
      const el = ROUND - timeLeft;
      if (!acidPending && acidPlan.length && el >= acidPlan[0]) {
        acidPlan.shift();
        const m = 40 * S;
        acidPending = { x: m + Math.random() * (W - 2 * m), t: 0.6 };
      }
      if (acidPending) {
        acidPending.t -= dt;
        if (acidPending.t <= 0) { spawnAcid(acidPending.x); acidPending = null; }
      }
      if (timeLeft <= 0) { endGame(); }
    }

    const b = playerBox();
    const catchTop = b.top + b.ph * 0.05, catchBottom = b.top + b.ph * 0.5;
    const halfW = b.pw * 0.42 * (1 + 0.15 * save.up.wide);
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.vy * dt; it.rot += it.vr * dt;
      const inX = Math.abs(it.x - player.x) < halfW + it.r * 0.4;
      const inY = it.y + it.r * 0.6 > catchTop && it.y < catchBottom;
      if (running && inX && inY) {
        const mult = rainbow > 0 ? 10 : 1;
        const gain = it.t.pts * mult;
        score += gain;
        const id = it.t.id;
        rs.counts[id] = (rs.counts[id] || 0) + 1;
        if (id === 'acid') {
          rs.acid++; rs.stamps.push(it.idx);
          rainbow = RAIN;
          addFloat(it.x, it.y, 'x10!', '#fff');
          burst(it.x, it.y, 40, true); haptic('big');
        } else {
          addFloat(it.x, it.y, '+' + gain, mult > 1 ? '#fff' : '#ffd23f');
          burst(it.x, it.y, mult > 1 ? 14 : 8, mult > 1); haptic();
        }
        items.splice(i, 1);
      } else if (it.y - it.r > H) {
        items.splice(i, 1);
      }
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i]; f.life -= dt; f.y -= 70 * dt;
      if (f.life <= 0) floats.splice(i, 1);
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
  }

  // ---------- рисование ----------
  const lamps = [[0.12, 0.62], [0.35, 0.5], [0.62, 0.58], [0.86, 0.46], [0.5, 0.72]];
  function drawBackground(t) {
    if (rainbow > 0) {
      const h = t * 160;
      const g = ctx.createLinearGradient(0, 0, W, H);
      for (let i = 0; i <= 6; i++) g.addColorStop(i / 6, `hsl(${(h + i * 55) % 360},85%,48%)`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(0, 0, W, H);
    } else {
      const th = THEMES[save.theme] || THEMES.city;
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, th.top); g.addColorStop(1, th.bot);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      for (const [lx, ly] of lamps) {
        const x = lx * W, y = ly * H;
        const rg = ctx.createRadialGradient(x, y, 0, x, y, 70 * S);
        rg.addColorStop(0, `rgba(${th.lamp},.55)`); rg.addColorStop(1, `rgba(${th.lamp},0)`);
        ctx.fillStyle = rg; ctx.fillRect(x - 80 * S, y - 80 * S, 160 * S, 160 * S);
      }
    }
  }

  function drawPic(im, size) {
    if (!im || !im.complete || !im.naturalWidth) return;
    const k = size / Math.max(im.naturalWidth, im.naturalHeight);
    const w = im.naturalWidth * k, h = im.naturalHeight * k;
    ctx.drawImage(im, -w / 2, -h / 2, w, h);
  }

  function drawItem(it, t) {
    ctx.save();
    ctx.translate(it.x, it.y);
    const r = it.r, id = it.t.id;
    if (id === 'acid') {
      const hue = (t * 400) % 360;
      const g = ctx.createLinearGradient(0, -r * 7, 0, 0);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, `hsla(${hue},100%,60%,.75)`);
      ctx.fillStyle = g; ctx.fillRect(-r * 0.7, -r * 7, r * 1.4, r * 7);
      ctx.rotate(Math.sin(t * 12) * 0.2);
      ctx.shadowColor = `hsl(${hue},100%,60%)`; ctx.shadowBlur = 24;
      drawPic(it.img, r * 2.4);
    } else {
      ctx.rotate(it.rot * 0.2);
      if (rainbow > 0) { ctx.shadowColor = '#fff'; ctx.shadowBlur = 14; }
      if (id === 'xanax') drawPic(pics.xanax, r * 3.1);
      else if (id === 'dollar') drawPic(pics.dollar, r * 2.9);
      else if (id === 'redbull') drawPic(pics.redbull, r * 3.2);
      else if (id === 'syringe') drawPic(pics.syringe, r * 3.7);
    }
    ctx.restore();
  }

  function drawWarning(t) {
    if (!acidPending) return;
    const x = acidPending.x, y = 70 * S + 24;
    const hue = (t * 500) % 360, pulse = 1 + 0.15 * Math.sin(t * 30);
    ctx.save(); ctx.translate(x, y); ctx.scale(pulse, pulse);
    ctx.fillStyle = `hsl(${hue},100%,60%)`; ctx.shadowColor = '#fff'; ctx.shadowBlur = 16;
    ctx.fillRect(-18 * S, -18 * S, 36 * S, 36 * S);
    ctx.shadowBlur = 0; ctx.fillStyle = '#12061f';
    ctx.font = Math.round(22 * S) + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('!', 0, 2);
    ctx.restore();
  }

  function drawPlayer(t) {
    const b = playerBox();
    if (rainbow > 0) {
      const rg = ctx.createRadialGradient(player.x, b.top + b.ph * 0.4, 10, player.x, b.top + b.ph * 0.4, b.pw * 0.9);
      rg.addColorStop(0, `hsla(${(t * 300) % 360},100%,65%,.65)`); rg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = rg; ctx.fillRect(player.x - b.pw, b.top - b.ph * 0.4, b.pw * 2, b.ph * 1.8);
    }
    if (img.complete && img.naturalWidth) ctx.drawImage(img, b.left, b.top, b.pw, b.ph);
    else { ctx.fillStyle = '#444'; ctx.fillRect(b.left, b.top, b.pw, b.ph); }
  }

  function drawHUD(t) {
    const top = 16;
    ctx.textBaseline = 'top';
    ctx.font = '18px ' + FONT;
    ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 0; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
    ctx.fillText(String(score), 14, top);
    ctx.textAlign = 'right';
    ctx.fillStyle = timeLeft < 10 ? '#ff5a6e' : '#fff';
    ctx.fillText(Math.ceil(Math.max(0, timeLeft)) + 'c', W - 14, top);
    if (rainbow > 0) {
      ctx.textAlign = 'center';
      ctx.fillStyle = `hsl(${(t * 400) % 360},100%,70%)`;
      ctx.font = '30px ' + FONT;
      ctx.fillText('x10', W / 2, top + 28);
      ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(W / 2 - 60, top + 70, 120, 8);
      ctx.fillStyle = '#fff'; ctx.fillRect(W / 2 - 60, top + 70, 120 * rainbow / RAIN, 8);
    }
    ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
  }

  function draw(t) {
    drawBackground(t);
    for (const it of items) drawItem(it, t);
    drawWarning(t);
    drawPlayer(t);
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = `hsl(${p.hue},95%,60%)`;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), 6, 6);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '14px ' + FONT;
    for (const f of floats) {
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life / 0.4));
      ctx.fillStyle = f.color; ctx.shadowColor = '#000'; ctx.shadowBlur = 0; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
    if (running) drawHUD(t);
  }

  // ---------- управление ----------
  window.addEventListener('pointerdown', (e) => { targetX = e.clientX; });
  window.addEventListener('pointermove', (e) => { if (e.buttons || e.pointerType === 'touch') targetX = e.clientX; });
  window.addEventListener('keydown', (e) => { keys[e.key] = true; });
  window.addEventListener('keyup', (e) => { keys[e.key] = false; });
  // блокируем прокрутку страницы, но списки магазина и достижений крутятся
  window.addEventListener('touchmove', (e) => {
    if (!(e.target.closest && e.target.closest('.scroll'))) e.preventDefault();
  }, { passive: false });

  function startGame() {
    reset();
    screens.forEach((n) => $(n).classList.remove('show'));
    running = true;
  }
  function endGame() {
    running = false;
    const earned = Math.floor(score / 20);
    const isRecord = score > save.best;
    if (isRecord) save.best = score;
    save.coins += earned;
    save.rounds++;
    for (const k of Object.keys(rs.counts)) save.totals[k] = (save.totals[k] || 0) + rs.counts[k];
    for (const idx of rs.stamps) if (!save.stamps.includes(idx)) save.stamps.push(idx);
    const got = checkAch(rs);
    persist();

    $('finalScore').textContent = score;
    $('bestLine').textContent = isRecord ? 'НОВЫЙ РЕКОРД!' : 'Рекорд: ' + save.best;
    $('earned').textContent = '+' + earned + ' 🪙';
    $('newAch').innerHTML = got.length
      ? got.map((a) => '🏆 ' + a.name + ' +' + a.reward + ' 🪙').join('<br>')
      : '';
    show('end');
  }

  $('play').addEventListener('click', startGame);
  $('again').addEventListener('click', startGame);
  $('toMenu').addEventListener('click', () => show('menu'));
  $('toShop').addEventListener('click', () => show('shop'));
  $('toAch').addEventListener('click', () => show('ach'));
  $('shopBack').addEventListener('click', () => show('menu'));
  $('achBack').addEventListener('click', () => show('menu'));
  updateMenu();

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw(now / 1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
